# ============================================================================
# docker-compose.yml
# ----------------------------------------------------------------------------
# Orquesta los servicios necesarios para la ejecución local del sistema:
#   - postgres: motor de base de datos relacional para Prisma.
#   - api:     backend NestJS (opcional, puede ejecutarse fuera de Docker
#              durante el desarrollo para aprovechar hot-reload nativo).
# ============================================================================
version: "3.9"

services:
  # --------------------------------------------------------------------------
  # PostgreSQL: motor relacional principal.
  # Volumen persistente para conservar datos entre reinicios.
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: padel_saas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-padel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-padel}
      POSTGRES_DB: ${POSTGRES_DB:-padel_saas}
    # Puerto host 5433 (no 5432) para no colisionar con otras instancias de
    # Postgres locales. La conexión desde la app usa localhost:5433.
    ports:
      - "5433:5432"
    volumes:
      - padel_saas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-padel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------------
  # API NestJS (opcional para producción / staging).
  # Para desarrollo se recomienda ejecutar `npm run start:dev` fuera de Docker.
  # --------------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: padel_saas_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-padel}:${POSTGRES_PASSWORD:-padel}@postgres:5432/${POSTGRES_DB:-padel_saas}?schema=public
      NODE_ENV: production
    env_file:
      - ./apps/api/.env
    ports:
      - "3001:3001"
    profiles:
      - full

volumes:
  padel_saas_pgdata:
    name: padel_saas_pgdata
